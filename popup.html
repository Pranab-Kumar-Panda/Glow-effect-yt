<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Reel Glow</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            width: 320px;
            background: #111;
            color: #eee;
            font: 14px system-ui, -apple-system, Segoe UI, sans-serif
        }

        header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid #262626
        }

        header img {
            width: 28px;
            height: 28px;
            border-radius: 6px
        }

        header h1 {
            font-size: 16px;
            margin: 0;
            flex: 1
        }

        main {
            padding: 8px 16px 16px
        }

        h2 {
            font-size: 11px;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #888;
            margin: 16px 0 6px
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 7px 0
        }

        .row label {
            flex: 1
        }

        .val {
            width: 38px;
            text-align: right;
            color: #aaa;
            font-variant-numeric: tabular-nums
        }

        input[type=range] {
            width: 130px;
            accent-color: #ff5a8a
        }

        input[type=checkbox] {
            width: 38px;
            height: 22px;
            appearance: none;
            background: #333;
            border-radius: 999px;
            position: relative;
            cursor: pointer;
            transition: background .2s
        }

        input[type=checkbox]::after {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #fff;
            transition: transform .2s
        }

        input[type=checkbox]:checked {
            background: #ff5a8a
        }

        input[type=checkbox]:checked::after {
            transform: translateX(16px)
        }

        button {
            width: 100%;
            margin-top: 14px;
            padding: 9px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1c1c1c;
            color: #eee;
            cursor: pointer;
            font-size: 14px
        }

        button:hover {
            background: #262626
        }

        p.note {
            color: #777;
            font-size: 12px;
            line-height: 1.5;
            margin: 12px 0 0
        }
    </style>
</head>

<body>
    <header>
        <img src="icons/icon48.png" alt="">
        <h1>Reel Glow</h1>
        <input type="checkbox" id="enabled" aria-label="Turn Reel Glow on or off">
    </header>
    <main>
        <h2>Where to use</h2>
        <div class="row"><label for="instagram">Instagram Reels</label><input type="checkbox" id="instagram"></div>
        <div class="row"><label for="youtube">YouTube Shorts</label><input type="checkbox" id="youtube"></div>

        <h2>Look</h2>
        <div class="row"><label for="size">Size</label><input type="range" id="size" min="0.1" max="0.8"
                step="0.05"><span class="val" id="sizeV"></span></div>
        <div class="row"><label for="opacity">Strength</label><input type="range" id="opacity" min="0.1" max="1"
                step="0.05"><span class="val" id="opacityV"></span></div>
        <div class="row"><label for="brightness">Brightness</label><input type="range" id="brightness" min="0.2"
                max="1.2" step="0.05"><span class="val" id="brightnessV"></span></div>
        <div class="row"><label for="saturate">Color</label><input type="range" id="saturate" min="0.5" max="2.5"
                step="0.1"><span class="val" id="saturateV"></span></div>
        <div class="row"><label for="softness">Softness</label><input type="range" id="softness" min="0" max="8"
                step="1"><span class="val" id="softnessV"></span></div>

        <h2>Performance</h2>
        <div class="row"><label for="fps">Updates / sec</label><input type="range" id="fps" min="6" max="30"
                step="1"><span class="val" id="fpsV"></span></div>

        <button id="reset">Reset to default</button>
        <p class="note">Changes apply instantly on any open Reels or Shorts tab. No need to refresh.</p>
    </main>
    <script src="popup.js"></script>
</body>

</html>
